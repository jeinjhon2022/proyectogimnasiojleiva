name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Claves de ejemplo, no reales: el build solo necesita que la variable exista
          # (Vite la incrusta en el bundle del cliente; no requiere ser válida para compilar).
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
